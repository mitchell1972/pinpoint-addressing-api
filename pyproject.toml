[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinpoint-addressing-api"
version = "0.1.0"
description = "Pinpoint — Nigeria digital addressing & geocoding API (MVP backend spine)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",          # API framework + JSON-Schema request/response contracts
    "uvicorn[standard]>=0.30", # ASGI server (dev + prod)
    "psycopg[binary,pool]>=3.2", # Postgres driver + async pool; PostGIS via raw SQL
    "pydantic>=2.7",           # request/response models (pulled by FastAPI, pinned here intentionally)
    "pydantic-settings>=2.3",  # 12-factor env config
    "openlocationcode>=1.0.1", # Google's official Plus Code reference impl (spec §9.2 interop)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",             # ASGI test client
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["test"]
markers = [
    "accuracy: forward-geocode accuracy harness — the north-star (spec §11, target >90%). May xfail until the engine is tuned.",
]
